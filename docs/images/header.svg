<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient: deep black with amber tint -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0b0b0d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14110c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0b0d;stop-opacity:1" />
    </linearGradient>

    <!-- Amber spotlight gradient -->
    <radialGradient id="spotlight" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#f0b429;stop-opacity:0.2" />
      <stop offset="40%" style="stop-color:#d99a1e;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0b0b0d;stop-opacity:0" />
    </radialGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8f8a80" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="1280" height="400" fill="url(#bgGradient)"/>

  <!-- Grid overlay -->
  <rect width="1280" height="400" fill="url(#grid)"/>

  <!-- Spotlight -->
  <ellipse cx="640" cy="200" rx="600" ry="280" fill="url(#spotlight)"/>

  <!-- Film sprocket holes - top edge -->
  <g fill="#8f8a80" opacity="0.25">
    <rect x="20" y="12" width="12" height="8" rx="1"/>
